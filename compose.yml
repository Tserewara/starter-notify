name: bgym-notify

services:
  redis:
    image: redis:7.4.1-alpine
    ports:
      - "56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  provider:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_MODE: provider
    ports:
      - "58001:8001"
    command: ["uvicorn", "app:provider_app", "--host", "0.0.0.0", "--port", "8001"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_MODE: api
      REDIS_URL: redis://redis:6379/0
    ports:
      - "58002:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: ["uvicorn", "app:api_app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVICE_MODE: worker
      REDIS_URL: redis://redis:6379/0
      PROVIDER_URL: http://provider:8001
    depends_on:
      redis:
        condition: service_healthy
    command: ["python3", "worker.py"]
